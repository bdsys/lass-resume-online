name: LLM health check

# Daily live check of the /tools LLM comparison on production. Models are
# auto-selected (newest Haiku / gemini-flash-lite-latest), so this is what
# notices a dead key, exhausted quota, or a model swap that broke the route.
# On failure it opens (or comments on) an `llm-health` issue, which emails the
# repo's watchers; on recovery it closes that issue.
#
# Manual run with test_alert=true skips the check and opens a [TEST] issue
# through the same path, to confirm the alert emails arrive.

on:
  schedule:
    - cron: "17 15 * * *"   # daily 15:17 UTC — off the hour, when GitHub's scheduler is busiest
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Skip the check and open a [TEST] alert issue"
        type: boolean
        default: false

concurrency:
  group: llm-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ALERT_TITLE: "LLM compare health check failing"
  ALERT_LABEL: llm-health

jobs:
  check:
    name: Live /api/llm-compare check
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6

      - name: Ensure alert label exists
        run: gh label create "$ALERT_LABEL" --color D93F0B --description "Automated LLM health check alerts" --force

      - name: Send test alert
        if: ${{ inputs.test_alert }}
        run: |
          printf 'This is a **test** of the LLM health check alert ([run](%s)).\n\nIf you got an email for this issue, real alerts will reach you too. Close this issue once confirmed.\n' \
            "$RUN_URL" > body.md
          gh issue create --title "[TEST] LLM health check alert" --label "$ALERT_LABEL" --body-file body.md

      - name: Run live check
        if: ${{ !inputs.test_alert }}
        run: |
          set -o pipefail
          bash scripts/llm-test.sh https://andrewlass.com 2>&1 | tee llm-health.log

      - name: Open or update alert issue
        if: ${{ failure() && !inputs.test_alert }}
        run: |
          {
            printf 'The daily live check of `/api/llm-compare` failed ([run](%s)).\n\n' "$RUN_URL"
            printf '```\n'
            sed 's/\x1b\[[0-9;]*m//g' llm-health.log 2>/dev/null | tail -40 || echo "(no check output)"
            printf '```\n'
          } > body.md
          existing=$(gh issue list --label "$ALERT_LABEL" --state open --json number,title \
            --jq "map(select(.title == \"$ALERT_TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$ALERT_TITLE" --label "$ALERT_LABEL" --body-file body.md
          fi

      - name: Close alert issue on recovery
        if: ${{ success() && !inputs.test_alert }}
        run: |
          existing=$(gh issue list --label "$ALERT_LABEL" --state open --json number,title \
            --jq "map(select(.title == \"$ALERT_TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered: the live check passed ([run]($RUN_URL))."
          fi
