name: Quality

on:
  push:
    branches: [main, dev, preview]
  pull_request:
    branches: [main, dev, preview]

# Cancel in-flight runs for the same branch when a new push arrives
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Quality gate: lint + typecheck + Vitest unit tests ──────────────────
  quality:
    name: Quality (lint · typecheck · unit tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test
