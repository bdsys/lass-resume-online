name: WAF demo

on:
  push:
    branches: [main, dev, preview]
  pull_request:
    branches: [main, dev, preview]

concurrency:
  group: waf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── WAF demo: typecheck + Vitest + Docker smoke ─────────────────────────
  waf:
    name: WAF demo (typecheck · unit tests · Docker smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6

      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: waf-demo-app/package-lock.json

      - name: Install waf-demo-app dependencies
        run: cd waf-demo-app && npm ci

      - name: Typecheck
        run: cd waf-demo-app && npm run typecheck

      - name: Unit tests (Vitest)
        run: cd waf-demo-app && npm test

      - name: Docker smoke test
        run: bash scripts/waf-smoke.sh
