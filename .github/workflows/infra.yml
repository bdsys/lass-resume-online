name: Infra

on:
  push:
    branches: [main, dev, preview]
  pull_request:
    branches: [main, dev, preview]

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── OpenTofu infra validation ───────────────────────────────────────────
  # Validates HCL format + provider schema without needing backend credentials.
  # -backend=false skips the R2 state backend so no secrets are required.
  infra:
    name: Infra (OpenTofu fmt + validate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "latest"

      - name: Format check
        run: tofu fmt -check -recursive infra

      - name: Init (no backend)
        run: cd infra && tofu init -backend=false -input=false

      - name: Validate
        run: cd infra && tofu validate
