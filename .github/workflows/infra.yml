name: Infra

on:
  push:
    branches: [main, dev, preview]
  pull_request:
    branches: [main, dev, preview]

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── OpenTofu infra validation ───────────────────────────────────────────
  # Validates HCL format + provider schema without needing backend credentials.
  # -backend=false skips the R2 state backend so no secrets are required.
  infra:
    name: Infra (OpenTofu fmt + validate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2
        with:
          tofu_version: "latest"

      - name: Format check
        run: tofu fmt -check -recursive infra

      - name: Init (no backend)
        run: cd infra && tofu init -backend=false -input=false

      - name: Validate
        run: cd infra && tofu validate
