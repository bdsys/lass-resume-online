name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-flight runs for the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Quality gate: lint + typecheck + Vitest unit tests ──────────────────
  quality:
    name: Quality (lint · typecheck · unit tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

  # ─── WAF demo: typecheck + Vitest + Docker smoke ─────────────────────────
  waf:
    name: WAF demo (typecheck · unit tests · Docker smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: waf-demo-app/package-lock.json

      - name: Install waf-demo-app dependencies
        run: cd waf-demo-app && npm ci

      - name: Typecheck
        run: cd waf-demo-app && npm run typecheck

      - name: Unit tests (Vitest)
        run: cd waf-demo-app && npm test

      - name: Docker smoke test
        run: bash scripts/waf-smoke.sh

  # ─── OpenTofu infra validation ───────────────────────────────────────────
  # Validates HCL format + provider schema without needing backend credentials.
  # -backend=false skips the R2 state backend so no secrets are required.
  infra:
    name: Infra (OpenTofu fmt + validate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "latest"

      - name: Format check
        run: tofu fmt -check -recursive infra

      - name: Init (no backend)
        run: cd infra && tofu init -backend=false -input=false

      - name: Validate
        run: cd infra && tofu validate

  # ─── E2E: Playwright on ubuntu-22.04 (supported by Playwright binaries) ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04
    needs: [quality, waf, infra]  # only run E2E if all quality gates pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + deps
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # Upload the Playwright HTML report so failures are inspectable in GitHub UI
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
