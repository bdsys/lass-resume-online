name = "lass-resume-online"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# KV namespace for caching GitHub API responses (~1h TTL)
# Get your real id with: wrangler kv namespace create GITHUB_CACHE
# Then paste the output id here before deploying
[[kv_namespaces]]
binding = "GITHUB_CACHE"
id = "817bc5b66c5045838c854758a53c70f6"

# Custom domains — managed here so `wrangler deploy` attaches them to the Worker
[[routes]]
pattern = "andrewlass.com"
custom_domain = true

[[routes]]
pattern = "www.andrewlass.com"
custom_domain = true

[[routes]]
pattern = "ip.andrewlass.com"
custom_domain = true

# ── Preview / staging environment ─────────────────────────────────────────────
# Deploy with: npm run deploy:preview
# Custom domain attaches on first deploy (same andrewlass.com zone).
#
# BEFORE FIRST DEPLOY — run these once:
#   npx wrangler kv namespace create GITHUB_CACHE_PREVIEW
#   → paste the returned id into the kv_namespaces id below
#   npx wrangler secret put GITHUB_TOKEN --env preview
#   npx wrangler secret put ANTHROPIC_API_KEY --env preview
#   npx wrangler secret put GOOGLE_API_KEY --env preview
#   npx wrangler secret put DEMO_KEY --env preview   ← must match production DEMO_KEY (the Fly X-Demo-Key value)

[env.preview]
name = "lass-resume-online-preview"

[env.preview.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[env.preview.kv_namespaces]]
binding = "GITHUB_CACHE"
id = "a22ea36ab2c84b60a17ccc3da5ca70aa"

[[env.preview.routes]]
pattern = "preview.www.andrewlass.com"
custom_domain = true
