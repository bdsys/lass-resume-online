name: E2E

on:
  push:
    branches: [main, dev, preview]
  pull_request:
    branches: [main, dev, preview]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── E2E: Playwright on ubuntu-22.04 (supported by Playwright binaries) ──
  # NOTE: this runs independently of the quality/waf/infra workflows so it gets
  # its own status badge. (A cross-workflow `needs:` gate isn't expressible in
  # GitHub Actions, so E2E runs in parallel rather than only after the gates.)
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + deps
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # Upload the Playwright HTML report so failures are inspectable in GitHub UI
      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
