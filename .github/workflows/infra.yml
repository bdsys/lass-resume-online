name: Infra

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── OpenTofu infra validation ───────────────────────────────────────────
  # Validates HCL format + provider schema without needing backend credentials.
  # -backend=false skips the R2 state backend so no secrets are required.
  infra:
    name: Infra (OpenTofu fmt + validate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "latest"

      - name: Format check
        run: tofu fmt -check -recursive infra

      - name: Init (no backend)
        run: cd infra && tofu init -backend=false -input=false

      - name: Validate
        run: cd infra && tofu validate
